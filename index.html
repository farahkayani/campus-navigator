<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2230;
    --ink-soft:#242C3D;
    --ink-soft-2:#2B3448;
    --paper:#F2EEE2;
    --amber:#E3A73B;
    --amber-dim:#7A5E27;
    --teal:#3D8577;
    --rust:#C1552C;
    --muted:#8D94A6;
    --line:#333D52;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber);color:var(--ink);}
  a{color:inherit;}

  .disp{ font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.04em; }
  .mono{ font-family:'JetBrains Mono',monospace; }

  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--amber); outline-offset:2px;
  }
  input, select{
    font-family:'Inter',sans-serif; font-size:14px;
    background:var(--ink); color:var(--paper);
    border:1px solid var(--line); border-radius:6px; padding:9px 11px;
  }

  /* ============ SHELL ============ */
  .shell{ max-width:1180px; margin:0 auto; padding:22px 22px 60px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:18px; margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{ width:34px; height:34px; flex:0 0 auto; }
  .brand-text .word{ font-size:20px; font-weight:600; letter-spacing:.06em; line-height:1; }
  .brand-text .tag{ font-size:11px; color:var(--muted); letter-spacing:.03em; margin-top:3px; }
  .topbar-stat{ text-align:right; }
  .topbar-stat .n{ font-family:'Oswald',sans-serif; font-size:26px; color:var(--amber); line-height:1; transition:transform .18s ease; }
  .topbar-stat .l{ font-size:10px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; margin-top:4px; }
  .stat-bump{ animation:bump .32s ease; }
  @keyframes bump{ 0%{transform:scale(1);} 35%{transform:scale(1.28);} 100%{transform:scale(1);} }

  /* ============ LAYOUT ============ */
  .layout{ display:grid; grid-template-columns:190px 1fr; gap:20px; align-items:start; }

  .rail{ display:flex; flex-direction:column; gap:2px; position:sticky; top:22px; }
  .rail button{
    display:flex; align-items:center; gap:10px;
    background:none; border:none; border-left:2px solid transparent;
    color:var(--muted); text-align:left; padding:11px 12px;
    font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.05em; text-transform:uppercase;
    border-radius:0 6px 6px 0;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .rail button .num{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--amber-dim); }
  .rail button:hover{ background:var(--ink-soft); color:var(--paper); }
  .rail button.active{ border-left-color:var(--amber); background:var(--ink-soft); color:var(--paper); }
  .rail button.active .num{ color:var(--amber); }

  .panel{
    background:var(--ink-soft); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px 28px; min-height:420px;
    animation:fadeIn .22s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .panel-head{ margin-bottom:18px; }
  .panel-head h1{ font-family:'Oswald',sans-serif; font-size:24px; letter-spacing:.02em; margin:0 0 6px; text-transform:uppercase; }
  .panel-head p{ margin:0; color:var(--muted); font-size:13.5px; line-height:1.5; max-width:60ch; }
  .struct-tag{
    display:inline-block; margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:11px;
    color:var(--teal); background:rgba(61,133,119,.12); border:1px solid rgba(61,133,119,.35);
    padding:3px 8px; border-radius:4px; letter-spacing:.02em;
  }

  /* ============ DIRECTORY ============ */
  .card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px; margin-top:16px; }
  .loc-card{
    background:var(--ink); border:1px solid var(--line); border-radius:8px; padding:14px 15px;
    display:flex; flex-direction:column; gap:8px;
  }
  .loc-card .top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .loc-card .id{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--amber); }
  .loc-card .name{ font-weight:600; font-size:14.5px; line-height:1.3; }
  .loc-card .meta{ display:flex; gap:14px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); }
  .loc-card .meta b{ color:var(--paper); font-weight:500; }
  .mini-btn{
    background:none; border:1px solid var(--line); color:var(--paper);
    border-radius:6px; padding:6px 10px; font-size:12px; align-self:flex-start;
    transition:border-color .15s, color .15s;
  }
  .mini-btn:hover{ border-color:var(--amber); color:var(--amber); }
  .mini-btn.primary{ background:var(--amber); border-color:var(--amber); color:var(--ink); font-weight:600; }
  .mini-btn.primary:hover{ background:#efb658; color:var(--ink); }
  .mini-btn.rust{ border-color:var(--rust); color:var(--rust); }
  .mini-btn.rust:hover{ background:var(--rust); color:var(--paper); }

  /* ============ VISITS / STACK ============ */
  .stack-list{ display:flex; flex-direction:column; gap:8px; margin-top:16px; }
  .stack-row{
    display:flex; align-items:center; gap:12px;
    background:var(--ink); border:1px solid var(--line); border-left:3px solid var(--teal);
    border-radius:6px; padding:10px 14px;
    animation:slideIn .2s ease;
  }
  @keyframes slideIn{ from{opacity:0; transform:translateX(-6px);} to{opacity:1; transform:translateX(0);} }
  .stack-row.top{ border-left-color:var(--amber); }
  .stack-row .rank{ font-family:'JetBrains Mono',monospace; color:var(--muted); font-size:12px; width:22px; }
  .stack-row .name{ flex:1; font-size:14px; }
  .stack-row .pill{ font-size:10px; letter-spacing:.05em; color:var(--ink); background:var(--amber); padding:2px 7px; border-radius:20px; text-transform:uppercase; font-weight:600; }
  .empty-note{ color:var(--muted); font-size:13.5px; margin-top:16px; padding:16px; border:1px dashed var(--line); border-radius:8px; }

  .action-row{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }

  /* ============ BROWSER ============ */
  .kiosk{ margin-top:16px; display:flex; flex-direction:column; align-items:center; gap:18px; }
  .kiosk-card{
    width:100%; max-width:420px; background:var(--ink); border:1px solid var(--line); border-radius:12px;
    padding:28px 26px; text-align:center; position:relative;
  }
  .kiosk-card .pos{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); }
  .kiosk-card .name{ font-family:'Oswald',sans-serif; font-size:26px; text-transform:uppercase; margin:10px 0 14px; letter-spacing:.02em; }
  .kiosk-card .stats{ display:flex; justify-content:center; gap:26px; margin-top:6px; }
  .kiosk-card .stats div{ text-align:center; }
  .kiosk-card .stats .v{ font-family:'JetBrains Mono',monospace; font-size:16px; color:var(--amber); }
  .kiosk-card .stats .l{ font-size:10px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; margin-top:2px; }
  .kiosk-nav{ display:flex; gap:10px; align-items:center; }
  .kiosk-nav button{
    background:var(--ink); border:1px solid var(--line); color:var(--paper); border-radius:8px;
    padding:10px 18px; font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.05em; text-transform:uppercase;
  }
  .kiosk-nav button:hover:not(:disabled){ border-color:var(--amber); color:var(--amber); }
  .kiosk-nav button:disabled{ opacity:.3; cursor:not-allowed; }

  /* ============ QUEUE ============ */
  .queue-wrap{ display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:16px; }
  @media(max-width:720px){ .queue-wrap{ grid-template-columns:1fr; } }
  .now-serving{
    background:var(--ink); border:1px solid var(--line); border-radius:10px; padding:20px; text-align:center;
  }
  .now-serving .l{ font-size:11px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; }
  .now-serving .name{ font-family:'Oswald',sans-serif; font-size:22px; margin-top:8px; text-transform:uppercase; min-height:28px; }
  .now-serving .served{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--teal); margin-top:10px; }
  .join-form{ display:flex; gap:8px; margin-top:14px; }
  .join-form input{ flex:1; }
  .ticket-list{ display:flex; flex-direction:column; gap:7px; max-height:260px; overflow-y:auto; }
  .ticket{
    display:flex; align-items:center; gap:10px; background:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:9px 12px; font-size:13.5px;
  }
  .ticket .n{ font-family:'JetBrains Mono',monospace; color:var(--amber); font-size:12px; }

  /* ============ SEARCH ============ */
  .search-form{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center; }
  .seg{ display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button{ background:var(--ink); border:none; color:var(--muted); padding:9px 14px; font-size:13px; }
  .seg button.active{ background:var(--amber); color:var(--ink); font-weight:600; }
  .search-result{ margin-top:20px; }
  .result-card{
    background:var(--ink); border:1px solid var(--teal); border-radius:8px; padding:18px 20px;
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .result-card.miss{ border-color:var(--rust); }
  .result-card .rname{ font-weight:600; font-size:16px; }
  .result-card .rmeta{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); margin-top:4px; }
  .comparisons-badge{ text-align:center; }
  .comparisons-badge .v{ font-family:'JetBrains Mono',monospace; font-size:20px; color:var(--amber); }
  .comparisons-badge .l{ font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }

  /* ============ ROUTES ============ */
  .route-controls{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; align-items:center; }
  .route-body{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; margin-top:20px; }
  @media(max-width:820px){ .route-body{ grid-template-columns:1fr; } }
  .map-wrap{ background:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px; }
  .map-wrap svg{ width:100%; height:auto; display:block; }
  .route-result{ display:flex; flex-direction:column; gap:12px; }
  .route-status{ font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:15px; letter-spacing:.03em; }
  .route-status.ok{ color:var(--teal); }
  .route-status.no{ color:var(--rust); }
  .chain{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:13.5px; }
  .chain .stop{ background:var(--ink); border:1px solid var(--line); border-radius:20px; padding:5px 12px; }
  .chain .arrow{ color:var(--amber); }
  .edge-line{ stroke:#3B4459; stroke-width:2; }
  .edge-line.hi{ stroke:var(--amber); stroke-width:3; stroke-dasharray:400; stroke-dashoffset:400; animation:draw 1s ease forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .node-dot{ fill:var(--ink-soft-2); stroke:var(--line); stroke-width:1.5; }
  .node-dot.hi{ fill:var(--amber); stroke:var(--amber); }
  .node-dot.endpoint{ fill:var(--teal); stroke:var(--teal); }
  .node-label{ fill:var(--muted); font-family:'JetBrains Mono',monospace; font-size:8.5px; }
  .node-label.hi{ fill:var(--paper); font-weight:600; }

  /* ============ SORT ============ */
  .sort-btns{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
  .sort-caption{ margin-top:12px; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); }
  .sort-list{ display:flex; flex-direction:column; gap:6px; margin-top:16px; }
  .sort-row{
    display:grid; grid-template-columns:32px 1.4fr .8fr .6fr; align-items:center; gap:12px;
    background:var(--ink); border:1px solid var(--line); border-radius:6px; padding:9px 14px; font-size:13.5px;
    animation:slideIn .18s ease;
  }
  .sort-row .rank{ font-family:'JetBrains Mono',monospace; color:var(--amber-dim); font-size:12px; }
  .sort-row .field{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); }
  .sort-row .field.hi{ color:var(--amber); font-weight:600; }
  .sort-head{
    display:grid; grid-template-columns:32px 1.4fr .8fr .6fr; gap:12px; padding:0 14px;
    font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-top:18px;
  }

  @media(max-width:720px){
    .layout{ grid-template-columns:1fr; }
    .rail{ position:static; flex-direction:row; overflow-x:auto; gap:4px; padding-bottom:6px; border-bottom:1px solid var(--line); }
    .rail button{ flex:0 0 auto; border-left:none; border-bottom:2px solid transparent; border-radius:6px 6px 0 0; white-space:nowrap; }
    .rail button.active{ border-bottom-color:var(--amber); }
    .panel{ padding:20px 18px; }
  }

  @media(prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="17" r="15.5" stroke="#E3A73B" stroke-width="1.5"/>
        <path d="M17 4 L20 15 L31 17 L20 19 L17 30 L14 19 L3 17 L14 15 Z" fill="#E3A73B" opacity="0.9"/>
      </svg>
      <div class="brand-text">
        <div class="word disp">Campus Navigator</div>
        <div class="tag mono">Bahria University Islamabad · Wayfinding Console</div>
      </div>
    </div>
    <div class="topbar-stat">
      <div class="n mono" id="statLocCount">15</div>
      <div class="l">Locations Indexed</div>
    </div>
  </div>

  <div class="layout">
    <nav class="rail" role="tablist" aria-label="Navigator sections" id="rail"></nav>
    <main id="panelHost"></main>
  </div>

</div>

<script>
/* ================================================================
   DATA — same 15 locations & 16 walkway edges as the C++ backend
   ================================================================ */
/* Sourced from the real BUIC campus guide map (Entrance-1, Entrance-2,
   BUHO signboard). distance/rating are illustrative placeholder values
   for the demo since the physical map doesn't print exact figures.
   x/y positions approximate each building's real position on the map. */
const locations = [
  {id:201, name:"Bahria Business School",        distance:180, rating:4.5, x:90, y:150},
  {id:202, name:"Main Library",                  distance:140, rating:4.8, x:230,y:80 },
  {id:203, name:"Fatima Girls Hostel",           distance:220, rating:4.2, x:330,y:140},
  {id:204, name:"Bahria Innovation Center",      distance:200, rating:4.6, x:90, y:250},
  {id:205, name:"Cafeteria (Pool Side)",         distance:260, rating:4.4, x:230,y:260},
  {id:206, name:"Iqbal Block",                   distance:250, rating:4.3, x:340,y:250},
  {id:207, name:"Jahangir Khan Gymnasium",       distance:340, rating:4.7, x:480,y:170},
  {id:208, name:"Cafeteria (Parking Side)",      distance:420, rating:4.1, x:590,y:90 },
  {id:209, name:"Well Being Center",             distance:90,  rating:4.0, x:90, y:380},
  {id:210, name:"Ibne Khuldun Auditorium",       distance:160, rating:4.5, x:190,y:390},
  {id:211, name:"Student Support Center",        distance:60,  rating:4.2, x:90, y:440},
  {id:212, name:"Bank Islami",                   distance:300, rating:3.9, x:300,y:370},
  {id:213, name:"ATM",                           distance:310, rating:3.8, x:380,y:350},
  {id:214, name:"Bank Alfalah",                  distance:320, rating:3.9, x:300,y:430},
  {id:215, name:"Sir Syed Block",                distance:280, rating:4.6, x:400,y:410},
  {id:216, name:"Mosque Dar-ul-Ilm",             distance:380, rating:4.9, x:500,y:370},
  {id:217, name:"Quaid Block",                   distance:430, rating:4.1, x:560,y:350},
  {id:218, name:"Bahria University Head Office", distance:460, rating:4.3, x:580,y:420},
  {id:219, name:"Parking Plaza",                 distance:400, rating:3.7, x:615,y:260},
];
const edgeDefs = [
  [202,201],[202,203],[201,204],[204,205],[205,206],[203,206],[206,207],
  [207,208],[208,219],[207,219],[204,209],[209,211],[209,210],[210,215],
  [215,212],[212,213],[215,214],[215,207],[215,216],[216,217],[217,218],
  [217,219],[218,219]
];
const adj = {};
locations.forEach(l => adj[l.id] = []);
edgeDefs.forEach(([a,b]) => { adj[a].push(b); adj[b].push(a); });
function idxById(id){ return locations.findIndex(l => l.id === id); }
function fmtDist(d){ return d + "m"; }

/* ================================================================
   STATE — mirrors the C++ program's structures
   ================================================================ */
let visitStack = [];      // array-based stack (indices), top = end of array
let browseIndex = 0;      // index pointer for the catalog browser
let queue = [];           // array-based FCFS queue of {name}
let totalServed = 0;

function bump(el){
  if(!el) return;
  el.classList.remove('stat-bump'); void el.offsetWidth; el.classList.add('stat-bump');
}

/* ================================================================
   BINARY SEARCH TREE — built once from `locations`, keyed by ID / Name
   ================================================================ */
class BSTNode{ constructor(idx){ this.idx=idx; this.left=null; this.right=null; } }
function insertBy(root, idx, keyFn){
  if(!root) return new BSTNode(idx);
  if(keyFn(locations[idx]) < keyFn(locations[root.idx])) root.left = insertBy(root.left, idx, keyFn);
  else root.right = insertBy(root.right, idx, keyFn);
  return root;
}
function searchBy(root, key, keyFn, state){
  if(!root) return null;
  state.comparisons++;
  const rk = keyFn(locations[root.idx]);
  if(rk === key) return root;
  if(key < rk) return searchBy(root.left, key, keyFn, state);
  return searchBy(root.right, key, keyFn, state);
}
let idRoot = null, nameRoot = null;
locations.forEach((l,i)=>{
  idRoot   = insertBy(idRoot, i, x => x.id);
  nameRoot = insertBy(nameRoot, i, x => x.name);
});

/* ================================================================
   BFS — reachability + path reconstruction over the adjacency list
   ================================================================ */
function bfsPath(startId, endId){
  const visited = new Set([startId]);
  const parent = {};
  const q = [startId];
  while(q.length){
    const cur = q.shift();
    if(cur === endId) break;
    for(const nxt of adj[cur]){
      if(!visited.has(nxt)){ visited.add(nxt); parent[nxt]=cur; q.push(nxt); }
    }
  }
  if(!visited.has(endId)) return null;
  const path=[endId]; let v=endId;
  while(v!==startId){ v=parent[v]; path.push(v); }
  return path.reverse();
}

/* ================================================================
   SORTING ALGORITHMS — operate on a copy of indices
   ================================================================ */
function bubbleSortByName(idx){
  idx=[...idx];
  for(let i=0;i<idx.length-1;i++)
    for(let j=0;j<idx.length-1-i;j++)
      if(locations[idx[j]].name > locations[idx[j+1]].name){ const t=idx[j];idx[j]=idx[j+1];idx[j+1]=t; }
  return idx;
}
function selectionSortByNameDesc(idx){
  idx=[...idx];
  for(let i=0;i<idx.length-1;i++){
    let maxPos=i;
    for(let j=i+1;j<idx.length;j++) if(locations[idx[j]].name > locations[idx[maxPos]].name) maxPos=j;
    const t=idx[i]; idx[i]=idx[maxPos]; idx[maxPos]=t;
  }
  return idx;
}
function insertionSortByDistance(idx){
  idx=[...idx];
  for(let i=1;i<idx.length;i++){
    const key=idx[i], kd=locations[key].distance; let j=i-1;
    while(j>=0 && locations[idx[j]].distance > kd){ idx[j+1]=idx[j]; j--; }
    idx[j+1]=key;
  }
  return idx;
}
function mergeSortByRating(idx){
  if(idx.length<=1) return idx;
  const mid=idx.length>>1;
  const L=mergeSortByRating(idx.slice(0,mid)), R=mergeSortByRating(idx.slice(mid));
  const out=[]; let i=0,j=0;
  while(i<L.length && j<R.length){
    if(locations[L[i]].rating >= locations[R[j]].rating) out.push(L[i++]); else out.push(R[j++]);
  }
  return out.concat(L.slice(i)).concat(R.slice(j));
}

/* ================================================================
   NAVIGATION SHELL
   ================================================================ */
const SECTIONS = [
  {key:'directory', num:'01', label:'Directory'},
  {key:'visits',    num:'02', label:'My Visits'},
  {key:'browse',    num:'03', label:'Browse'},
  {key:'queue',     num:'04', label:'Queue'},
  {key:'search',    num:'05', label:'Search'},
  {key:'routes',    num:'06', label:'Routes'},
  {key:'sort',      num:'07', label:'Sort'},
];
let activeSection = 'directory';

const rail = document.getElementById('rail');
SECTIONS.forEach(s=>{
  const btn = document.createElement('button');
  btn.role='tab'; btn.id='tab-'+s.key;
  btn.innerHTML = `<span class="num mono">${s.num}</span><span>${s.label}</span>`;
  btn.addEventListener('click', ()=>setActive(s.key));
  rail.appendChild(btn);
});
function setActive(key){
  activeSection = key;
  document.querySelectorAll('.rail button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+key).classList.add('active');
  render();
}

const host = document.getElementById('panelHost');

function render(){
  if(activeSection==='directory') renderDirectory();
  else if(activeSection==='visits') renderVisits();
  else if(activeSection==='browse') renderBrowse();
  else if(activeSection==='queue') renderQueue();
  else if(activeSection==='search') renderSearch(lastSearchMode || 'id');
  else if(activeSection==='routes') renderRoutes();
  else if(activeSection==='sort') renderSort(lastSortKey);
}

/* ---------------- 01 DIRECTORY ---------------- */
function renderDirectory(){
  host.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h1>Location Directory</h1>
        <p>Every campus location lives in one fixed-size catalog. Every other feature — the visit log, the queue, the search trees, the route graph — refers back to an entry here by index.</p>
        <span class="struct-tag">Array · Location[15]</span>
      </div>
      <div class="card-grid" id="dirGrid"></div>
    </div>`;
  const grid = document.getElementById('dirGrid');
  locations.forEach((l,i)=>{
    const card = document.createElement('div');
    card.className='loc-card';
    card.innerHTML = `
      <div class="top-row">
        <div><div class="id mono">#${l.id}</div><div class="name">${l.name}</div></div>
      </div>
      <div class="meta"><span>Dist <b>${fmtDist(l.distance)}</b></span><span>Rating <b>${l.rating}/5</b></span></div>
      <button class="mini-btn">Mark visited</button>`;
    card.querySelector('button').addEventListener('click', ()=>{ visit(i); });
    grid.appendChild(card);
  });
}

/* ---------------- shared: push a visit onto the stack ---------------- */
function visit(idx){
  visitStack.push(idx);
  bump(document.getElementById('statLocCount'));
  if(activeSection==='visits') renderVisits();
}

/* ---------------- 02 MY VISITS (stack) ---------------- */
function renderVisits(){
  host.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h1>Recent Visits</h1>
        <p>Every location you mark as visited is pushed onto a stack, so the most recent stop always shows first. Undo pops it straight back off.</p>
        <span class="struct-tag">Stack · LIFO</span>
      </div>
      <div class="action-row">
        <button class="mini-btn rust" id="undoBtn">↺ Undo last visit</button>
      </div>
      <div id="stackHost"></div>
    </div>`;
  document.getElementById('undoBtn').addEventListener('click', ()=>{
    if(visitStack.length){ visitStack.pop(); renderVisits(); }
  });
  const wrap = document.getElementById('stackHost');
  if(!visitStack.length){
    wrap.innerHTML = `<div class="empty-note">No visits logged yet — mark a location from the Directory or Search tab to get started.</div>`;
    return;
  }
  const list = document.createElement('div');
  list.className='stack-list';
  for(let i=visitStack.length-1; i>=0; i--){
    const l = locations[visitStack[i]];
    const rank = visitStack.length - i;
    const row = document.createElement('div');
    row.className = 'stack-row' + (rank===1 ? ' top':'');
    row.innerHTML = `<span class="rank mono">${String(rank).padStart(2,'0')}</span>
      <span class="name">${l.name}</span>
      ${rank===1 ? '<span class="pill">Most recent</span>' : ''}`;
    list.appendChild(row);
  }
  wrap.appendChild(list);
}

/* ---------------- 03 BROWSE (index pointer) ---------------- */
function renderBrowse(){
  const l = locations[browseIndex];
  host.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h1>Catalog Browser</h1>
        <p>Page through every location one at a time, like flipping through a campus directory board.</p>
        <span class="struct-tag">Array + Index Pointer</span>
      </div>
      <div class="kiosk">
        <div class="kiosk-card">
          <div class="pos mono">${String(browseIndex+1).padStart(2,'0')} / ${locations.length}</div>
          <div class="name">${l.name}</div>
          <div class="stats">
            <div><div class="v">${fmtDist(l.distance)}</div><div class="l">Distance</div></div>
            <div><div class="v">${l.rating}/5</div><div class="l">Rating</div></div>
            <div><div class="v">#${l.id}</div><div class="l">ID</div></div>
          </div>
        </div>
        <div class="kiosk-nav">
          <button id="prevBtn" ${browseIndex===0?'disabled':''}>‹ Previous</button>
          <button class="mini-btn primary" id="visitBtn">Mark visited</button>
          <button id="nextBtn" ${browseIndex===locations.length-1?'disabled':''}>Next ›</button>
        </div>
      </div>
    </div>`;
  document.getElementById('prevBtn').addEventListener('click', ()=>{ if(browseIndex>0){browseIndex--; renderBrowse();} });
  document.getElementById('nextBtn').addEventListener('click', ()=>{ if(browseIndex<locations.length-1){browseIndex++; renderBrowse();} });
  document.getElementById('visitBtn').addEventListener('click', ()=>{ visit(browseIndex); });
}

/* ---------------- 04 QUEUE (FCFS) ---------------- */
function renderQueue(){
  host.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h1>Busy Resource Queue</h1>
        <p>A live first-come-first-served simulation for a busy shared resource — the Library Front Desk.</p>
        <span class="struct-tag">Queue · FCFS</span>
      </div>
      <div class="queue-wrap">
        <div>
          <div class="now-serving">
            <div class="l">Now Serving</div>
            <div class="name" id="servingName">—</div>
            <div class="served mono" id="servedCount">Total served: ${totalServed}</div>
          </div>
          <form class="join-form" id="joinForm">
            <input type="text" id="joinName" placeholder="Enter name" required />
            <button type="submit" class="mini-btn primary">Join queue</button>
          </form>
          <div class="action-row">
            <button class="mini-btn" id="serveBtn">Serve next →</button>
          </div>
        </div>
        <div>
          <div class="l" style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Waiting (${queue.length})</div>
          <div class="ticket-list" id="ticketList"></div>
        </div>
      </div>
    </div>`;
  document.getElementById('joinForm').addEventListener('submit', e=>{
    e.preventDefault();
    const input = document.getElementById('joinName');
    const name = input.value.trim();
    if(!name) return;
    queue.push({name});
    input.value='';
    renderQueue();
  });
  document.getElementById('serveBtn').addEventListener('click', ()=>{
    if(!queue.length) return;
    const served = queue.shift();
    totalServed++;
    document.getElementById('servingName').textContent = served.name;
    renderQueue();
  });
  const list = document.getElementById('ticketList');
  if(!queue.length){
    list.innerHTML = `<div class="empty-note">Queue is empty.</div>`;
  } else {
    queue.forEach((p,i)=>{
      const t=document.createElement('div'); t.className='ticket';
      t.innerHTML = `<span class="n mono">${String(i+1).padStart(2,'0')}</span><span>${p.name}</span>`;
      list.appendChild(t);
    });
  }
}

/* ---------------- 05 SEARCH (BST) ---------------- */
let lastSearchMode = 'id';
let lastSearchResult = null;
function renderSearch(mode){
  lastSearchMode = mode;
  host.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h1>Search Locations</h1>
        <p>Two binary search trees — one keyed by ID, one keyed by name — cut the search down from a full scan to a handful of comparisons.</p>
        <span class="struct-tag">Binary Search Tree</span>
      </div>
      <div class="search-form">
        <div class="seg">
          <button data-m="id" class="${mode==='id'?'active':''}">By ID</button>
          <button data-m="name" class="${mode==='name'?'active':''}">By Name</button>
        </div>
        <form id="searchForm" style="display:flex; gap:8px;">
          ${mode==='id'
            ? `<input type="number" id="searchInput" placeholder="e.g. 113" required />`
            : `<input list="nameOptions" id="searchInput" placeholder="e.g. Main Library" required />
               <datalist id="nameOptions">${locations.map(l=>`<option value="${l.name}">`).join('')}</datalist>`}
          <button type="submit" class="mini-btn primary">Search</button>
        </form>
      </div>
      <div class="search-result" id="searchResult"></div>
    </div>`;
  host.querySelectorAll('.seg button').forEach(b=>{
    b.addEventListener('click', ()=>renderSearch(b.dataset.m));
  });
  document.getElementById('searchForm').addEventListener('submit', e=>{
    e.preventDefault();
    const val = document.getElementById('searchInput').value.trim();
    const state = {comparisons:0};
    let found;
    if(mode==='id') found = searchBy(idRoot, Number(val), x=>x.id, state);
    else found = searchBy(nameRoot, val, x=>x.name, state);
    lastSearchResult = {found, state, val, mode};
    showSearchResult();
  });
  if(lastSearchResult) showSearchResult();
}
function showSearchResult(){
  const box = document.getElementById('searchResult');
  const {found, state, val} = lastSearchResult;
  if(found){
    const l = locations[found.idx];
    box.innerHTML = `
      <div class="result-card">
        <div>
          <div class="rname">${l.name}</div>
          <div class="rmeta">ID #${l.id} · ${fmtDist(l.distance)} · ${l.rating}/5</div>
        </div>
        <div class="comparisons-badge">
          <div class="v mono" id="cmpVal">${state.comparisons}</div>
          <div class="l">Comparisons</div>
        </div>
        <button class="mini-btn primary" id="searchVisitBtn">Mark visited</button>
      </div>`;
    bump(document.getElementById('cmpVal'));
    document.getElementById('searchVisitBtn').addEventListener('click', ()=>visit(found.idx));
  } else {
    box.innerHTML = `
      <div class="result-card miss">
        <div>
          <div class="rname">No match for "${val}"</div>
          <div class="rmeta">${state.comparisons} comparisons made before the tree ran out of nodes</div>
        </div>
      </div>`;
  }
}

/* ---------------- 06 ROUTES (Graph + BFS) ---------------- */
function renderRoutes(){
  host.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h1>Route Finder</h1>
        <p>Campus walkways form a graph. Breadth-first search checks whether two locations are connected — and if so, traces the shortest hop path between them.</p>
        <span class="struct-tag">Graph · BFS</span>
      </div>
      <div class="route-controls">
        <select id="fromSel"></select>
        <span class="mono" style="color:var(--muted)">→</span>
        <select id="toSel"></select>
        <button class="mini-btn primary" id="findBtn">Find route</button>
      </div>
      <div class="route-body">
        <div class="map-wrap">
          <svg viewBox="0 0 640 460" id="mapSvg"></svg>
        </div>
        <div class="route-result" id="routeResult"></div>
      </div>
    </div>`;
  const fromSel = document.getElementById('fromSel');
  const toSel = document.getElementById('toSel');
  locations.forEach(l=>{
    fromSel.innerHTML += `<option value="${l.id}">${l.name}</option>`;
    toSel.innerHTML += `<option value="${l.id}">${l.name}</option>`;
  });
  fromSel.value = 202; toSel.value = 218;
  drawMap([]);
  document.getElementById('findBtn').addEventListener('click', ()=>{
    const start = Number(fromSel.value), end = Number(toSel.value);
    const resultBox = document.getElementById('routeResult');
    if(start===end){
      resultBox.innerHTML = `<div class="route-status no">Pick two different locations.</div>`;
      drawMap([]);
      return;
    }
    const path = bfsPath(start,end);
    if(!path){
      resultBox.innerHTML = `<div class="route-status no">✕ No route exists</div>
        <p style="color:var(--muted); font-size:13.5px; margin:0;">These two locations aren't connected by any recorded campus walkway.</p>`;
      drawMap([]);
    } else {
      const names = path.map(id=>locations[idxById(id)].name);
      resultBox.innerHTML = `<div class="route-status ok">✓ Route found — ${path.length} stops</div>
        <div class="chain">${names.map((n,i)=> (i>0?'<span class="arrow">→</span>':'') + `<span class="stop">${n}</span>`).join('')}</div>`;
      drawMap(path);
    }
  });
}
function drawMap(highlightPath){
  const svg = document.getElementById('mapSvg');
  const hiSet = new Set(highlightPath);
  const hiEdges = new Set();
  for(let i=0;i<highlightPath.length-1;i++) hiEdges.add(highlightPath[i]+'-'+highlightPath[i+1]);
  let s = '';
  edgeDefs.forEach(([a,b])=>{
    const A = locations[idxById(a)], B = locations[idxById(b)];
    const hi = hiEdges.has(a+'-'+b) || hiEdges.has(b+'-'+a);
    s += `<line class="edge-line ${hi?'hi':''}" x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" />`;
  });
  locations.forEach(l=>{
    const hi = hiSet.has(l.id);
    const isEndpoint = highlightPath.length && (l.id===highlightPath[0] || l.id===highlightPath[highlightPath.length-1]);
    s += `<circle class="node-dot ${isEndpoint?'endpoint':(hi?'hi':'')}" cx="${l.x}" cy="${l.y}" r="7"/>`;
    s += `<text class="node-label ${hi?'hi':''}" x="${l.x}" y="${l.y-11}" text-anchor="middle">${l.name}</text>`;
  });
  svg.innerHTML = s;
}

/* ---------------- 07 SORT ---------------- */
let lastSortKey = null;
const SORTS = {
  bubble:    {label:'Bubble Sort', tag:'O(n²) · Alphabetical A–Z', field:'name', fn: idx=>bubbleSortByName(idx)},
  selection: {label:'Selection Sort', tag:'O(n²) · Alphabetical Z–A', field:'name', fn: idx=>selectionSortByNameDesc(idx)},
  insertion: {label:'Insertion Sort', tag:'O(n²) worst · Nearest distance first', field:'distance', fn: idx=>insertionSortByDistance(idx)},
  merge:     {label:'Merge Sort', tag:'O(n log n) · Best rated first', field:'rating', fn: idx=>mergeSortByRating(idx)},
};
function renderSort(key){
  host.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h1>Sort Locations</h1>
        <p>Four classic algorithms, each paired with the field it sorts best — from simple quadratic sorts to merge sort's O(n log n) sweep.</p>
        <span class="struct-tag">Bubble · Selection · Insertion · Merge</span>
      </div>
      <div class="sort-btns" id="sortBtns"></div>
      <div class="sort-caption mono" id="sortCaption">${key ? '' : 'Choose an algorithm to sort the catalog.'}</div>
      <div id="sortListHost"></div>
    </div>`;
  const btnHost = document.getElementById('sortBtns');
  Object.entries(SORTS).forEach(([k,def])=>{
    const b = document.createElement('button');
    b.className = 'mini-btn' + (key===k ? ' primary' : '');
    b.textContent = def.label;
    b.addEventListener('click', ()=>{ lastSortKey=k; renderSort(k); });
    btnHost.appendChild(b);
  });
  if(!key) return;
  const def = SORTS[key];
  document.getElementById('sortCaption').textContent = def.tag;
  const sortedIdx = def.fn(locations.map((_,i)=>i));
  const listHost = document.getElementById('sortListHost');
  listHost.innerHTML = `<div class="sort-head"><span></span><span>Name</span><span>Distance</span><span>Rating</span></div>`;
  const list = document.createElement('div');
  list.className='sort-list';
  sortedIdx.forEach((idx,i)=>{
    const l = locations[idx];
    const row = document.createElement('div');
    row.className='sort-row';
    row.innerHTML = `
      <span class="rank mono">${String(i+1).padStart(2,'0')}</span>
      <span>${l.name}</span>
      <span class="field mono ${def.field==='distance'?'hi':''}">${fmtDist(l.distance)}</span>
      <span class="field mono ${def.field==='rating'?'hi':''}">${l.rating}/5</span>`;
    list.appendChild(row);
  });
  listHost.appendChild(list);
}

/* ================================================================
   BOOT
   ================================================================ */
setActive('directory');
</script>
